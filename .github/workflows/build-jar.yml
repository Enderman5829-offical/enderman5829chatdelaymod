name: Build Jar

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew clean build

      - name: Validate remapped jar
        run: |
          JAR="$(ls build/libs/chatdelaymod-*.jar | grep -v sources | head -n 1)"
          test -n "$JAR"
          test -s "$JAR"
          jar tf "$JAR" | grep -q 'fabric.mod.json'
          jar tf "$JAR" | grep -q 'com/enderman5829/chatdelaymod/ChatDelayModClient.class'

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: chatdelaymod-jars
          path: |
            build/libs/*.jar
            build/devlibs/*.jar
          if-no-files-found: error
